<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聆汐 LingXi｜Music</title>
  <meta name="description" content="聆汐 LingXi 音樂作品列表">
  <meta name="theme-color" content="#0d0d10">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:#f5f2ef;
      background:linear-gradient(180deg,#121216,#09090b);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif
    }
    a{color:inherit;text-decoration:none}
    .nav{
      position:sticky;top:0;z-index:20;background:rgba(9,9,11,.82);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.08)
    }
    .nav-inner{
      max-width:1120px;margin:auto;padding:15px 20px;
      display:flex;align-items:center;justify-content:space-between
    }
    .brand{font-family:Georgia,serif;font-style:italic;font-size:26px}
    .brand small{font-style:normal;font-size:12px;margin-left:7px;color:#aaa4aa}
    .back{
      border:1px solid rgba(255,255,255,.18);border-radius:999px;
      padding:9px 13px;font-size:11px;letter-spacing:1px;color:#d8d2d6
    }
    .hero{max-width:1120px;margin:auto;padding:38px 20px 18px}
    .eyebrow{font-size:10px;letter-spacing:4px;color:#8f8990;margin-bottom:9px}
    h1{margin:0;font-size:40px;font-weight:500}
    .sub{margin-top:10px;color:#8f8990;font-size:13px;line-height:1.7}
    .grid{
      max-width:1120px;margin:auto;padding:12px 20px 70px;
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px
    }
    .song{
      border-radius:18px;border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);overflow:hidden;padding:8px
    }
    .spotify-frame{
      width:100%;height:152px;border:0;border-radius:12px;display:block;
      background:#18181c
    }
    .song-meta{padding:10px 3px 2px}
    .song-no{font-size:9px;letter-spacing:2px;color:#77727a;margin-bottom:5px}
    .song h2{font-size:14px;font-weight:500;margin:0 0 3px}
    .artist{font-size:11px;color:#858087}
    .spotify-btn{
      display:block;text-align:center;margin-top:9px;padding:9px 8px;border-radius:999px;
      background:#eee8eb;color:#111214;font-size:11px
    }
    footer{
      padding:26px 20px 40px;text-align:center;color:#5e5a60;
      font-size:9px;letter-spacing:2px;border-top:1px solid rgba(255,255,255,.06)
    }
    @media(max-width:820px){
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-left:12px;padding-right:12px}
      .hero{padding-left:14px;padding-right:14px}
      h1{font-size:32px}
      .spotify-frame{height:152px}
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">LingXi <small>聆汐</small></div>
      <a class="back" href="index.html">← BACK HOME</a>
    </div>
  </nav>

  <header class="hero">
    <div class="eyebrow">LINGXI MUSIC</div>
    <h1>音樂作品</h1>
    <div class="sub">直接使用 Spotify 官方 Embed 顯示封面與歌曲資訊，之後新增歌曲只要再加一張卡片。</div>
  </header>

  <main class="grid">

    <article class="song">
      <iframe
        class="spotify-frame"
        src="https://open.spotify.com/embed/track/4Ip1SVyZ9GYDsTSgr6PZ7A?utm_source=oembed&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
        title="我真的撐不住了 Spotify">
      </iframe>
      <div class="song-meta">
        <div class="song-no">SINGLE 01</div>
        <h2>我真的撐不住了</h2>
        <div class="artist">聆汐 · LingXi</div>
      </div>
      <a class="spotify-btn" href="https://open.spotify.com/track/4Ip1SVyZ9GYDsTSgr6PZ7A" target="_blank" rel="noopener">Spotify 聆聽 ↗</a>
    </article>

    <article class="song">
      <iframe
        class="spotify-frame"
        src="https://open.spotify.com/embed/track/39n18cQaHndNeS9JnOHrCS?utm_source=oembed&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
        title="還在這裡 Spotify">
      </iframe>
      <div class="song-meta">
        <div class="song-no">SINGLE 02</div>
        <h2>還在這裡</h2>
        <div class="artist">聆汐 · LingXi</div>
      </div>
      <a class="spotify-btn" href="https://open.spotify.com/track/39n18cQaHndNeS9JnOHrCS" target="_blank" rel="noopener">Spotify 聆聽 ↗</a>
    </article>

    <article class="song">
      <iframe
        class="spotify-frame"
        src="https://open.spotify.com/embed/album/09AOo7EJzZ5oXLkfAglJzH?utm_source=generator&theme=0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
        title="我們曾經那麼愛 Spotify">
      </iframe>
      <div class="song-meta">
        <div class="song-no">SINGLE 03</div>
        <h2>我們曾經那麼愛</h2>
        <div class="artist">聆汐 · LingXi</div>
      </div>
      <a class="spotify-btn" href="https://open.spotify.com/album/09AOo7EJzZ5oXLkfAglJzH" target="_blank" rel="noopener">Spotify 聆聽 ↗</a>
    </article>

  </main>

  <footer>© 2026 LINGXI · BONSKAZ MUSIC</footer>
</body>
</html>
